<section class="bg-gray-50 py-10 px-6">
  <div class="container mx-auto flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800">Shop by Category</h2>
    <a href="#" class="text-green-600 font-bold flex items-center gap-1 hover:text-green-700">
      View All Categories <i class="fas fa-arrow-right"></i>
    </a>
  </div>

  <!-- Categories Grid -->
  <div class="container mx-auto grid grid-cols-1 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
    @for (category of categories.data; track $index) {
      <div
        class="bg-white rounded-lg shadow-sm hover:shadow-md transition text-center p-6 cursor-pointer border"
      >
        <img [src]="category.image" [alt]="category.name" class="mx-auto object-contain mb-4 rounded-full w-20 h-20"  />
        <h3 class="font-semibold text-gray-800">{{ category.name }}</h3>
      </div>
    }
  </div>
</section>
